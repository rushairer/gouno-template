name: Sync lockfile

on:
  push:
    branches: [refactor/template-codegen-v1]

permissions:
  contents: write

concurrency:
  group: gouno-template-lockfile-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Regenerate go.sum
        run: |
          tmp="$(mktemp -d)"
          ./scripts/render-template.sh "$tmp/project" example.com/gouno-template-lockfile gouno_template_lockfile
          rm -f "$tmp/project/go.sum"
          (cd "$tmp/project" && go mod tidy)
          cp "$tmp/project/go.sum" go.sum
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- go.sum; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.sum
          git commit -m 'chore(template): regenerate dependency lockfile'
          git push origin HEAD:refactor/template-codegen-v1
